# The gateway in front of Nextcloud's bucket nc-plain. Plain HTTP and no admin
# listener: it is reachable only on the scenario's own network.
server:
  listen: "0.0.0.0:9000"
  presign:
    max_expiry: 1h
admin:
  listen: ""
upstream:
  endpoint: http://minio:9000
  region: us-east-1
  path_style: true
  access_key_id: minioadmin
  secret_access_key: minioadmin
keys:
  provider: file
  keyring: /etc/blindbucket/keyring.json
clients:
  - name: nextcloud
    access_key_id: NCSCENARIOPLAIN
    secret_access_key: nc-scenario-secret-plain
    buckets: ["nc-plain"]
