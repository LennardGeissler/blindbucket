# The provider and the two gateways in front of it, inside the cluster, in
# the namespace storage. The gateways' configurations and the keyring are
# created by run.sh from files, as ConfigMaps and a Secret.
apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: storage
spec:
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data"]
          env:
            - {name: MINIO_ROOT_USER, value: minioadmin}
            - {name: MINIO_ROOT_PASSWORD, value: minioadmin}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: storage
spec:
  selector: {app: minio}
  ports:
    - {port: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-plain
  namespace: storage
spec:
  selector:
    matchLabels: {app: gateway-plain}
  template:
    metadata:
      labels: {app: gateway-plain}
    spec:
      containers:
        - name: gateway
          image: blindbucket-apps-gateway:latest
          imagePullPolicy: Never
          args: ["serve", "-v", "--config", "/etc/blindbucket/blindbucket.yaml"]
          env:
            - {name: BLINDBUCKET_PASSPHRASE, value: apps-scenario-not-a-secret}
          volumeMounts:
            - {name: config, mountPath: /etc/blindbucket/blindbucket.yaml, subPath: blindbucket.yaml}
            - {name: keyring, mountPath: /etc/blindbucket/keyring.json, subPath: keyring.json}
          readinessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 2
      volumes:
        - {name: config, configMap: {name: gateway-plain}}
        - {name: keyring, secret: {secretName: keyring}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-plain
  namespace: storage
spec:
  selector: {app: gateway-plain}
  ports:
    - {port: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-names
  namespace: storage
spec:
  selector:
    matchLabels: {app: gateway-names}
  template:
    metadata:
      labels: {app: gateway-names}
    spec:
      containers:
        - name: gateway
          image: blindbucket-apps-gateway:latest
          imagePullPolicy: Never
          args: ["serve", "-v", "--config", "/etc/blindbucket/blindbucket.yaml"]
          env:
            - {name: BLINDBUCKET_PASSPHRASE, value: apps-scenario-not-a-secret}
          volumeMounts:
            - {name: config, mountPath: /etc/blindbucket/blindbucket.yaml, subPath: blindbucket.yaml}
            - {name: keyring, mountPath: /etc/blindbucket/keyring.json, subPath: keyring.json}
          readinessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 2
      volumes:
        - {name: config, configMap: {name: gateway-names}}
        - {name: keyring, secret: {secretName: keyring}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-names
  namespace: storage
spec:
  selector: {app: gateway-names}
  ports:
    - {port: 9000}
