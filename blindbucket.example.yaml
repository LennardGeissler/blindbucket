# blindbucket configuration.
#
# Secrets are referenced, never written here: ${VAR} is resolved from the
# environment at startup, and a missing variable is a startup error rather than
# an empty credential.

server:
  # Loopback by default. Between client and proxy the body is plaintext, so a
  # public listener without TLS would undo the point of the gateway.
  listen: "127.0.0.1:9000"
  # tls:
  #   cert_file: /etc/blindbucket/tls.crt
  #   key_file: /etc/blindbucket/tls.key

# Operator-facing listener: metrics, health and, if asked for, profiles. None of
# it is for storage clients, which is why it is a separate address and why the
# default stays on loopback. Leave listen empty to disable it entirely.
admin:
  listen: "127.0.0.1:9100"
  # /debug/pprof exposes goroutine stacks and heap contents. Off unless you are
  # looking at something.
  pprof: false

upstream:
  endpoint: http://localhost:9002        # the MinIO from docker-compose.yml
  region: us-east-1                      # "auto" for Cloudflare R2
  path_style: true
  access_key_id: ${UPSTREAM_ACCESS_KEY_ID}
  secret_access_key: ${UPSTREAM_SECRET_ACCESS_KEY}

# Where the root key that unlocks the keyring comes from. Whichever source is
# named, it is consulted once at startup: the KEKs are then in memory and no
# request pays a round trip to a key service (ADR-013).
keys:
  provider: file                         # file | vault | awskms
  keyring: keyring.json
  # passphrase_file: /run/secrets/keyring-passphrase
  # Otherwise the passphrase comes from $BLINDBUCKET_PASSPHRASE.

  # provider: vault -- Vault decrypts the root key and never hands out the key
  # that does it. Revoking the transit key locks every instance out at its next
  # restart.
  # vault:
  #   address: ${VAULT_ADDR}
  #   token: ${VAULT_TOKEN}
  #   mount: transit                     # where the engine is mounted
  #   key_name: blindbucket
  #   namespace: ""                      # Vault Enterprise only

  # provider: awskms -- the same shape against KMS. Credentials are explicit:
  # this build does not use the AWS credential chain (ADR-013).
  # awskms:
  #   region: eu-central-1
  #   key_id: alias/blindbucket
  #   access_key_id: ${AWS_ACCESS_KEY_ID}
  #   secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  #   endpoint: ""                       # override for an AWS-compatible endpoint
  #   # Added to the KMS encryption context, on top of the fixed
  #   # blindbucket=root-key entry every keyring carries. Not a secret: it is
  #   # logged in CloudTrail and recorded in the keyring. Its point is that a key
  #   # policy can require it, narrowing a grant to this use of the key.
  #   encryption_context:
  #     deployment: prod-eu

crypto:
  log2_chunk_size: 16                    # 64 KiB

# Object-name encryption (ADR-015). Off by default, and not a switch to flip on a
# bucket that already holds objects: with it on, an object lives at the encrypted
# form of its key, so turning it on hides everything written before and turning it
# off hides everything written since. Moving an existing bucket across is a
# rewrite of every object's key.
#
# The keyring must hold a name key -- keyrings created by `blindbucket keygen` do;
# older ones need `keygen --add-name-key`. Add it before writing objects: the key
# decides where every object is stored and cannot be changed once objects exist
# under it.
#
# While this is on, only PutObject, GetObject, HeadObject and DeleteObject are
# served. Listing, multipart, copy and tagging answer NotImplemented until each
# has been taught what an encrypted name means -- listing first, because the
# provider sorts by the stored key and an unsorted listing makes some clients
# delete objects that exist (ADR-017).
# names:
#   encrypt: true

# A hash-chained, signed record of what the gateway served (ADR-016). Off unless
# a path is given here. The keyring must hold an audit key -- keyrings created by
# `blindbucket keygen` do; older ones need `keygen --add-audit-key`.
#
# Verify with:
#   blindbucket audit verify --public-key <key> /var/lib/blindbucket/audit.log
#
# and record that public key somewhere this host does not control. A log checked
# against a key taken from the same machine proves only that the two agree.
# `blindbucket audit pubkey --keyring keyring.json` prints it.
# audit:
#   log: /var/lib/blindbucket/audit.log
#   # How much of the tail an attacker holding the file could remove without
#   # trace: whichever of these comes first bounds it. Fewer entries and shorter
#   # intervals mean a smaller window and one fsync each.
#   checkpoint_every: 256
#   checkpoint_interval: 30s
#   # Opening a log verifies it from the beginning, so this bounds startup.
#   rotate_bytes: 134217728              # 128 MiB
#   # Refuse requests once the log cannot be written, rather than serving on
#   # with a record known to be incomplete. Defaults to true. Turning it off
#   # means a full disk silently switches auditing off instead of paging you.
#   fail_closed: true

# Credentials the proxy accepts from its own clients. These are unrelated to the
# upstream credentials above, which a client never sees -- that separation is
# what stops a client bypassing the gateway.
clients:
  - name: local-dev
    access_key_id: ${BB_ACCESS_KEY_ID}
    secret_access_key: ${BB_SECRET_ACCESS_KEY}
    buckets: ["blindbucket-dev"]     # "*" for every bucket
