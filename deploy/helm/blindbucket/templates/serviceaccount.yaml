{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blindbucket.serviceAccountName" . }}
  labels:
    {{- include "blindbucket.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The gateway never calls the Kubernetes API; see the Deployment.
automountServiceAccountToken: false
{{- end }}
