apiVersion: v2
name: blindbucket
description: A transparent S3 encryption gateway, run as a shared service behind TLS.
type: application
# The chart's own version. It changes when the chart does; appVersion is the
# gateway release it deploys by default, and moving it is a change to the chart
# like any other -- a release commit bumps both. Every version is published to
# ghcr.io once and never again with other contents (build/chart.sh).
version: 0.1.8
appVersion: "1.5.0"
home: https://github.com/LennardGeissler/blindbucket
sources:
  - https://github.com/LennardGeissler/blindbucket
maintainers:
  - name: Lennard Geißler
    url: https://github.com/LennardGeissler
# What Artifact Hub shows. Two of them move with every chart version: the
# image is the one appVersion names, which `make chart` checks, and changes
# describes this version of the chart, not the gateway -- the gateway's are in
# CHANGELOG.md. No signKey: the chart is not signed.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: blindbucket
      image: ghcr.io/lennardgeissler/blindbucket:1.5.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/LennardGeissler/blindbucket#readme
    - name: Chart documentation
      url: https://github.com/LennardGeissler/blindbucket/tree/main/deploy/helm/blindbucket#readme
    - name: Threat model
      url: https://github.com/LennardGeissler/blindbucket/blob/main/docs/THREAT_MODEL.md
    - name: Format specification
      url: https://github.com/LennardGeissler/blindbucket/blob/main/docs/FORMAT.md
    - name: support
      url: https://github.com/LennardGeissler/blindbucket/issues
  artifacthub.io/changes: |
    - kind: changed
      description: Deploys blindbucket 1.5.0 by default.
keywords: [s3, encryption, gateway, proxy]
