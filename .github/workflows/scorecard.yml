name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain practices -- pinned
# actions, token permissions, branch rules, signed releases, maintained
# dependencies -- and publishes the result behind the README badge. Findings
# also land in the Security tab. It runs on main and weekly, not on pull
# requests: it grades the repository, not a change.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # upload the findings to the Security tab
      id-token: write          # publish the result for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
