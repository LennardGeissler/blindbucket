# The integration suite, the KMS tests, and the clients through a gateway whose
# keyring KMS seals, against real AWS in eu-central-1.
#
# Manual only: it costs a few cents a run and needs the resources that
# deploy/aws-test/template.yaml creates. It runs in the `aws` environment,
# which is the only place the role can be assumed from (the role's trust policy
# names it), so a pull request from a fork never gets AWS credentials.
#
# The environment's variables, from the stack's outputs:
#   AWS_ROLE_ARN   RoleArn
#   AWS_BUCKET     Bucket
#   AWS_KMS_KEY    KeyArn
name: AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # the OIDC token the role is assumed with

env:
  GOTOOLCHAIN: local
  AWS_REGION: eu-central-1

jobs:
  aws:
    name: Integration (AWS S3, KMS, clients)
    runs-on: ubuntu-24.04
    environment: aws
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      # What AWS is expected to do with the two conditional writes rotation
      # relies on is the default, "enforced". internal/probe checks it, and
      # fails if AWS does otherwise.
      - name: Provider tests against S3
        env:
          BLINDBUCKET_TEST_S3_ENDPOINT: https://s3.${{ env.AWS_REGION }}.amazonaws.com
          BLINDBUCKET_TEST_S3_BUCKET: ${{ vars.AWS_BUCKET }}
          BLINDBUCKET_TEST_S3_PATH_STYLE: "false"
        run: |
          export BLINDBUCKET_TEST_S3_REGION="$AWS_REGION"
          export BLINDBUCKET_TEST_S3_ACCESS_KEY="$AWS_ACCESS_KEY_ID"
          export BLINDBUCKET_TEST_S3_SECRET_KEY="$AWS_SECRET_ACCESS_KEY"
          export BLINDBUCKET_TEST_S3_SESSION_TOKEN="$AWS_SESSION_TOKEN"
          go test -count=1 -v ./internal/probe/... 2>&1 | tee probe.log
          # -v: against a provider an ocean away every request costs a round
          # trip, and the suite takes minutes; without it the log is silent
          # until the end.
          go test -count=1 -v -timeout 25m ./internal/upstream/... ./internal/proxy/... ./cmd/... 2>&1 |
            tee suite.log | grep -E '^(=== RUN|\s*--- |ok|FAIL|PASS|panic)|_test\.go:[0-9]+:'
          test "${PIPESTATUS[0]}" -eq 0

      - name: Keep the full log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-suite-log
          path: suite.log

      - name: Root-key tests against KMS
        env:
          BLINDBUCKET_TEST_KMS_KEY_ID: ${{ vars.AWS_KMS_KEY }}
        run: go test -count=1 -v -run 'KMS' ./internal/rootkey/...

      # From here on the gateway runs as it would be deployed on AWS: its
      # keyring's root key sealed by the KMS key, its upstream the real bucket,
      # and every credential a ${VAR} reference to the role's session. Nothing
      # below knows a passphrase.
      - name: Keyring sealed by KMS
        env:
          AWS_KMS_KEY: ${{ vars.AWS_KMS_KEY }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        run: |
          set -euo pipefail
          make build
          cat > blindbucket.yaml <<YAML
          server:
            listen: "127.0.0.1:9000"
          upstream:
            endpoint: https://s3.${AWS_REGION}.amazonaws.com
            region: ${AWS_REGION}
            path_style: false
            access_key_id: \${AWS_ACCESS_KEY_ID}
            secret_access_key: \${AWS_SECRET_ACCESS_KEY}
            session_token: \${AWS_SESSION_TOKEN}
          clients:
            - name: ci
              access_key_id: CITESTKEY
              secret_access_key: ci-test-secret-key
              buckets: ["${AWS_BUCKET}"]
          keys:
            provider: awskms
            keyring: keyring.json
            awskms:
              region: ${AWS_REGION}
              key_id: ${AWS_KMS_KEY}
              access_key_id: \${AWS_ACCESS_KEY_ID}
              secret_access_key: \${AWS_SECRET_ACCESS_KEY}
              session_token: \${AWS_SESSION_TOKEN}
          YAML
          ./bin/blindbucket keygen --config blindbucket.yaml --out keyring.json --kid aws 2>&1 |
            tee keygen.log
          grep -q 'sealed by AWS KMS key' keygen.log
          test "$(jq -r .root_key.source keyring.json)" = awskms

          # The keyring says who sealed it, and a gateway configured for a
          # passphrase is refused rather than asked for one.
          sed 's/provider: awskms/provider: file/' blindbucket.yaml > passphrase.yaml
          if BLINDBUCKET_PASSPHRASE=anything ./bin/blindbucket keys list \
              --config passphrase.yaml --keyring keyring.json > mismatch.log 2>&1; then
            echo "a KMS-sealed keyring opened with a passphrase"; cat mismatch.log; exit 1
          fi
          grep -q 'is sealed by' mismatch.log

      - name: Start the gateway
        run: |
          ./bin/blindbucket serve --config blindbucket.yaml > gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9000/; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:9000/ || { cat gateway.log; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: boto3 scenarios
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_SESSION_TOKEN: ""
          AWS_DEFAULT_REGION: us-east-1
          BLINDBUCKET_ENDPOINT: http://127.0.0.1:9000
          BLINDBUCKET_BUCKET: ${{ vars.AWS_BUCKET }}
          BLINDBUCKET_PREFIX: bbtest/clients-${{ github.run_id }}/boto3/
        run: |
          pip install --quiet boto3
          python3 test/integration/clients/boto3/scenarios.py

      # The client-side steps from ci.yml's compatibility job, against AWS: the
      # aws-chunked trailer path, multipart above 8 MiB with a range across a
      # part boundary, and presigned reads.
      - name: AWS CLI scenarios
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_SESSION_TOKEN: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          BUCKET: ${{ vars.AWS_BUCKET }}
          PREFIX: bbtest/clients-${{ github.run_id }}/cli
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.multipart_threshold 8MB
          aws configure set default.s3.multipart_chunksize 8MB
          base="s3://$BUCKET/$PREFIX"

          head -c 200000 /dev/urandom > payload.bin
          aws s3 cp --no-progress payload.bin "$base/payload.bin"
          aws s3 cp --no-progress "$base/payload.bin" restored.bin
          cmp payload.bin restored.bin
          test "$(aws s3 ls "$base/payload.bin" | awk '{print $3}')" = "200000"

          head -c 41943040 /dev/urandom > big.bin        # 40 MiB, five parts
          aws s3 cp --no-progress big.bin "$base/big.bin"
          aws s3 cp --no-progress "$base/big.bin" big-restored.bin
          cmp big.bin big-restored.bin
          test "$(aws s3 ls "$base/big.bin" | awk '{print $3}')" = "41943040"
          aws s3api get-object --bucket "$BUCKET" --key "$PREFIX/big.bin" \
            --range bytes=8388598-8388618 slice.bin >/dev/null
          dd if=big.bin of=expected-slice.bin bs=1 skip=8388598 count=21 status=none
          cmp slice.bin expected-slice.bin

          url=$(aws s3 presign "$base/payload.bin" --expires-in 300)
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY curl -sf -o presigned.bin "$url"
          cmp payload.bin presigned.bin

      # Around the gateway, with the role's own credentials: what AWS holds is
      # not what the client wrote.
      - name: The bucket holds ciphertext
        env:
          BUCKET: ${{ vars.AWS_BUCKET }}
          PREFIX: bbtest/clients-${{ github.run_id }}/cli
        run: |
          set -euo pipefail
          aws s3 cp --no-progress "s3://$BUCKET/$PREFIX/payload.bin" raw.bin
          if cmp -s payload.bin raw.bin; then echo "the stored object is the plaintext"; exit 1; fi
          test "$(wc -c < raw.bin)" -gt 200000
          aws s3 rm --recursive "s3://$BUCKET/$PREFIX/"

      # A restart is the moment the root key is asked for again: a second
      # gateway process opens the same keyring through KMS and reads what the
      # first one wrote. Its own step, so that it starts with the role's
      # credentials and not the client's.
      - name: Write before a restart
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_SESSION_TOKEN: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          BUCKET: ${{ vars.AWS_BUCKET }}
          KEY: bbtest/clients-${{ github.run_id }}/restart.bin
        run: aws s3 cp --no-progress payload.bin "s3://$BUCKET/$KEY"

      - name: Restart the gateway
        run: |
          pkill -f 'blindbucket serve'
          while pgrep -f 'blindbucket serve' >/dev/null; do sleep 0.2; done
          ./bin/blindbucket serve --config blindbucket.yaml > gateway-restarted.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9000/; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:9000/ || { cat gateway-restarted.log; exit 1; }

      - name: Read after the restart
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_SESSION_TOKEN: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          BUCKET: ${{ vars.AWS_BUCKET }}
          KEY: bbtest/clients-${{ github.run_id }}/restart.bin
        run: |
          set -euo pipefail
          aws s3 cp --no-progress "s3://$BUCKET/$KEY" after-restart.bin
          cmp payload.bin after-restart.bin

      # Off KMS and back on it (ADR-023): reseal opens what it sealed before it
      # replaces the file, which is only a real check against a service that
      # could refuse to decrypt -- this is the one place it runs against KMS
      # itself rather than the emulator. The object written before the restart
      # must still read afterwards: the keys inside never changed.
      - name: Reseal to a passphrase and back to KMS
        run: |
          set -euo pipefail
          pkill -f 'blindbucket serve'
          while pgrep -f 'blindbucket serve' >/dev/null; do sleep 0.2; done
          printf 'reseal-in-ci\n' > new-passphrase && chmod 600 new-passphrase
          ./bin/blindbucket reseal --keyring keyring.json --config blindbucket.yaml \
            --new-passphrase-file new-passphrase 2>&1 | tee reseal.log
          test "$(jq -r '.root_key.source // "passphrase"' keyring.json)" = passphrase
          BLINDBUCKET_PASSPHRASE=reseal-in-ci ./bin/blindbucket reseal --keyring keyring.json \
            --to-config blindbucket.yaml 2>&1 | tee -a reseal.log
          test "$(jq -r .root_key.source keyring.json)" = awskms
          grep -q 'from AWS KMS key .* to a passphrase' reseal.log
          grep -q 'from a passphrase to AWS KMS key' reseal.log
          ./bin/blindbucket serve --config blindbucket.yaml > gateway-resealed.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9000/; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:9000/ || { cat gateway-resealed.log; exit 1; }

      - name: Read after the reseals
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_SESSION_TOKEN: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          BUCKET: ${{ vars.AWS_BUCKET }}
          KEY: bbtest/clients-${{ github.run_id }}/restart.bin
        run: |
          set -euo pipefail
          aws s3 cp --no-progress "s3://$BUCKET/$KEY" after-reseal.bin
          cmp payload.bin after-reseal.bin
          aws s3 rm "s3://$BUCKET/$KEY"

      # The gateway's own web identity (ADR-024), against real STS: the job's
      # GitHub OIDC token stands in for the projected service-account token of
      # IRSA, and the role's trust policy is the one the job itself assumed.
      # No key is in the configuration or the environment, for the upstream
      # or for KMS -- what the gateway uses, it resolved itself.
      - name: A gateway on web identity
        env:
          AWS_KMS_KEY: ${{ vars.AWS_KMS_KEY }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value > web-identity-token
          chmod 600 web-identity-token
          cat > web-identity.yaml <<YAML
          server:
            listen: "127.0.0.1:9001"
          admin:
            listen: ""
          upstream:
            endpoint: https://s3.${AWS_REGION}.amazonaws.com
            region: ${AWS_REGION}
            path_style: false
            credential_source: web_identity
          clients:
            - name: ci
              access_key_id: CITESTKEY
              secret_access_key: ci-test-secret-key
              buckets: ["${AWS_BUCKET}"]
          keys:
            provider: awskms
            keyring: keyring.json
            awskms:
              region: ${AWS_REGION}
              key_id: ${AWS_KMS_KEY}
              credential_source: web_identity
          YAML
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
            AWS_WEB_IDENTITY_TOKEN_FILE="$PWD/web-identity-token" AWS_ROLE_ARN="$ROLE_ARN" \
            AWS_ROLE_SESSION_NAME="blindbucket-ci-${{ github.run_id }}" \
            ./bin/blindbucket serve --config web-identity.yaml > gateway-web-identity.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9001/; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:9001/ || { cat gateway-web-identity.log; exit 1; }
          grep -q '"msg":"upstream credentials".*web identity' gateway-web-identity.log

      - name: Clients through the web-identity gateway
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_SESSION_TOKEN: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9001
          BUCKET: ${{ vars.AWS_BUCKET }}
          KEY: bbtest/clients-${{ github.run_id }}/web-identity.bin
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          aws s3 cp --no-progress big.bin "s3://$BUCKET/$KEY"
          aws s3 cp --no-progress "s3://$BUCKET/$KEY" web-identity.bin
          cmp big.bin web-identity.bin
          aws s3 rm "s3://$BUCKET/$KEY"
          pkill -f 'serve --config web-identity.yaml'

      - name: Keep the gateway logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-gateway-logs
          path: |
            gateway*.log
            keygen.log
            mismatch.log
            reseal.log
