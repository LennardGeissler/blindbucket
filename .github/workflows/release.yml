name: Release

# Tag-driven: pushing v* builds the binaries, the checksums, the SBOM and the
# image. The release is left as a draft so the notes can be read before anyone
# else sees them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  packages: write   # push the image to ghcr.io
  id-token: write   # for provenance, if it is added later

env:
  GOTOOLCHAIN: local

jobs:
  # The release must not be the first time the tests run on this commit, but it
  # must not be possible to tag a commit that fails them either.
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -count=1 ./...

  # Separate, and on current Go rather than the module's floor: govulncheck
  # itself needs a newer toolchain than this module declares, and GOTOOLCHAIN is
  # local so nothing silently downloads one. It still analyses the module as
  # declared. ci.yml does the same thing for the same reason -- and the first
  # version of this file did not, which is what the v0.1.0 tag ran into.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    name: goreleaser
    needs: [verify, vuln]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs the tag history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Syft produces the SBOM goreleaser attaches to each archive.
      - uses: anchore/sbom-action/download-syft@v0

      # The release's text is its section of CHANGELOG.md, joined into lines a
      # release page renders and with its links pinned to the tag. A tag the
      # changelog does not describe stops here, before anything is published:
      # every release up to 1.1.0 went out with no text but the footer.
      - name: Release notes from CHANGELOG.md
        run: go run ./build/releasenotes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
