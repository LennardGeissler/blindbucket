name: Release

# Tag-driven: pushing v* builds the binaries, the checksums, the SBOM and the
# image. The release is left as a draft so the notes can be read before anyone
# else sees them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  packages: write   # push the image to ghcr.io
  id-token: write   # for provenance, if it is added later

env:
  GOTOOLCHAIN: local

jobs:
  # The release must not be the first time the tests run on this commit, but it
  # must not be possible to tag a commit that fails them either. Both on the
  # module's floor, which is what go.mod promises builds, and on current Go,
  # which is what the release is built with.
  verify:
    name: Verify before releasing (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test -race -count=1 ./...

  release:
    name: goreleaser
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs the tag history

      # Current Go, not go.mod's. go-version-file read `go 1.24.0` as an exact
      # version, so every release up to 1.1.0 was built with Go 1.24.0 and
      # shipped the standard library's holes since February 2025 -- in net/http
      # and crypto/tls, the gateway's own front door. The go directive is the
      # oldest Go the module builds with; it says nothing about which Go a
      # release should carry, and the answer to that is a patched one.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # In this job, with the Go that builds: govulncheck reports what is
      # reachable through this toolchain's standard library, so run anywhere
      # else it vouches for a binary it did not look at. ci.yml's run on
      # stable never saw what the release shipped, which is how 1.24.0 went
      # unnoticed.
      - name: govulncheck, against the toolchain that builds the release
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Syft produces the SBOM goreleaser attaches to each archive.
      - uses: anchore/sbom-action/download-syft@v0

      # The release's text is its section of CHANGELOG.md, joined into lines a
      # release page renders and with its links pinned to the tag. A tag the
      # changelog does not describe stops here, before anything is published:
      # every release up to 1.1.0 went out with no text but the footer.
      - name: Release notes from CHANGELOG.md
        run: go run ./build/releasenotes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
