name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GOTOOLCHAIN=local forbids Go from silently downloading a newer toolchain, so a
# job that says it builds on the declared floor really does. Jobs that run a
# tool rather than the project override the Go version instead.
env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      # v8 of the action is the one that speaks golangci-lint v2; earlier
      # versions install a v1 binary, which rejects this repository's config.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "1.24" is the declared floor: crypto/hkdf arrived there, and the
        # dependencies are pinned to releases that still build with it.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test -race -count=1 ./...

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Short runs on every push; the nightly workflow runs them for 15 minutes
      # each. Seed corpora under testdata/ are exercised by `go test` regardless.
      - run: make fuzz FUZZTIME=30s

  # Micro-benchmarks run in CI and report regressions via
  # benchstat. Reporting, not failing: a shared runner's throughput varies by
  # more than most real regressions, so a hard threshold would either cry wolf
  # every week or be set so loose it catches nothing. The comparison goes in the
  # job summary, where a reviewer sees it next to the diff that caused it.
  bench:
    name: Micro-benchmarks (benchstat)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Benchmark the base
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          go test ./internal/crypto/stream -run '^$' -bench . -benchmem \
            -count=6 -benchtime=200x > /tmp/base.txt

      - name: Benchmark the change
        run: |
          git checkout --quiet ${{ github.sha }}
          go test ./internal/crypto/stream -run '^$' -bench . -benchmem \
            -count=6 -benchtime=200x > /tmp/head.txt

      - name: Compare
        run: |
          go run golang.org/x/perf/cmd/benchstat@latest /tmp/base.txt /tmp/head.txt \
            | tee /tmp/benchstat.txt
          {
            echo "## Micro-benchmarks"
            echo
            echo "Base \`${{ github.event.pull_request.base.sha }}\` against this branch."
            echo "Shared runners are noisy; read the p-values, not the percentages."
            echo
            echo '```'
            cat /tmp/benchstat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # MinIO is started with an explicit command rather than as a service
      # container, because it needs one ("server /data") and services cannot
      # supply it. Chainguard's image, because MinIO no longer publishes one
      # (see docker-compose.yml); it carries mc as well.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9002/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:9002/minio/health/live >/dev/null
      - name: Create the test bucket
        run: |
          docker run --rm --network host --entrypoint sh cgr.dev/chainguard/minio:latest -c \
            "mc alias set local http://localhost:9002 minioadmin minioadmin && \
             mc mb --ignore-existing local/blindbucket-test"
      - name: Run the integration tests
        env:
          BLINDBUCKET_TEST_S3_ENDPOINT: http://localhost:9002
        run: go test -race -count=1 ./internal/upstream/... ./internal/proxy/... ./internal/probe/...
      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio

  # Every released version writes, the current build reads. The promise that
  # objects written by any release stay readable, checked on every change
  # rather than stated (test/upgrade/upgrade.sh).
  upgrade:
    name: Upgrade (every release reads back)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the release tags are what it builds
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9002/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh cgr.dev/chainguard/minio:latest -c \
            "mc alias set local http://localhost:9002 minioadmin minioadmin && \
             mc mb --ignore-existing local/blindbucket-test"
      - name: Read back what every release wrote
        run: test/upgrade/upgrade.sh

  # The same suite against an independent S3 implementation. Whatever the
  # gateway has quietly come to rely on in MinIO shows up here first: the first
  # run found a provider that ignores If-Match on completion (ADR-020).
  integration-garage:
    name: Integration (Garage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Garage
        # The script prints `export NAME=value` lines; GITHUB_ENV wants them bare.
        run: test/providers/garage.sh | sed -n 's/^export //p' >> "$GITHUB_ENV"
      - name: Run the integration tests
        run: go test -race -count=1 ./internal/upstream/... ./internal/proxy/... ./internal/probe/...
      - name: Garage logs on failure
        if: failure()
        run: docker logs blindbucket-garage

  keyservices:
    name: Root-key sources (Vault, KMS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Vault in dev mode: a fixed root token, no storage, gone with the runner.
      # None of this is a secret, and the alternative -- mocking the HTTP API --
      # would only assert what the code already believes about it.
      - name: Start Vault and create the transit key
        run: |
          docker run -d --name vault --cap-add IPC_LOCK -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=blindbucket-dev-token \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:latest
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8200/v1/sys/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf -X POST -H "X-Vault-Token: blindbucket-dev-token" \
            -d '{"type":"transit"}' http://localhost:8200/v1/sys/mounts/transit
          curl -sf -X POST -H "X-Vault-Token: blindbucket-dev-token" \
            -d '{}' http://localhost:8200/v1/transit/keys/blindbucket

      # An emulator of the KMS protocol, not AWS. What this job establishes is
      # that the client speaks KMS correctly; docs/COMPATIBILITY.md says so
      # rather than claiming the service was tested.
      - name: Start the KMS emulator
        run: |
          docker run -d --name kms -p 4599:8080 \
            -e PORT=8080 -e KMS_REGION=us-east-1 \
            nsmithuk/local-kms:latest
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null -X POST http://localhost:4599/ \
              -H "X-Amz-Target: TrentService.CreateKey" \
              -H "Content-Type: application/x-amz-json-1.1" -d '{}'; then break; fi
            sleep 1
          done

      - name: Run the root-key tests
        env:
          BLINDBUCKET_TEST_VAULT_ADDR: http://localhost:8200
          BLINDBUCKET_TEST_VAULT_TOKEN: blindbucket-dev-token
          BLINDBUCKET_TEST_KMS_ENDPOINT: http://localhost:4599
        run: go test -race -count=1 ./internal/rootkey/...

      - name: Service logs on failure
        if: failure()
        run: |
          docker logs vault || true
          docker logs kms || true

  clients:
    name: Client compatibility (AWS CLI, boto3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9002/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh cgr.dev/chainguard/minio:latest -c \
            "mc alias set local http://localhost:9002 minioadmin minioadmin && \
             mc mb --ignore-existing local/blindbucket-dev"

      - name: Start the gateway
        env:
          BLINDBUCKET_PASSPHRASE: ci-passphrase-not-a-secret
        run: |
          make build
          ./bin/blindbucket keygen --out keyring.json --kid ci
          cat > blindbucket.yaml <<'YAML'
          server:
            listen: "127.0.0.1:9000"
          upstream:
            endpoint: http://localhost:9002
            region: us-east-1
            path_style: true
            access_key_id: minioadmin
            secret_access_key: minioadmin
          clients:
            - name: ci
              access_key_id: CITESTKEY
              secret_access_key: ci-test-secret-key
              buckets: ["blindbucket-dev"]
          keys:
            provider: file
            keyring: keyring.json
          crypto:
            log2_chunk_size: 16
          YAML
          ./bin/blindbucket serve --config blindbucket.yaml > gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9000/; then break; fi
            sleep 1
          done

      # Multipart is where statelessness has to hold: parts of one upload are
      # served by whichever instance the balancer picks, and nothing is shared
      # between them but the keyring. A second instance behind a round-robin is
      # the only way to test that claim rather than assert it.
      - name: Start a second instance behind a round-robin balancer
        env:
          BLINDBUCKET_PASSPHRASE: ci-passphrase-not-a-secret
        run: |
          sed 's/127.0.0.1:9000/127.0.0.1:9010/' blindbucket.yaml > blindbucket-b.yaml
          ./bin/blindbucket serve --config blindbucket-b.yaml > gateway-b.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9010/; then break; fi
            sleep 1
          done

          cat > nginx.conf <<'NGINX'
          events {}
          http {
            upstream gateways {
              server 127.0.0.1:9000;
              server 127.0.0.1:9010;
            }
            server {
              listen 9020;
              client_max_body_size 0;
              proxy_request_buffering off;   # keep the stream a stream
              location / {
                proxy_pass http://gateways;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
              }
            }
          }
          NGINX
          docker run -d --name lb --network host \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9020/; then break; fi
            sleep 1
          done

      - name: boto3 scenarios
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_DEFAULT_REGION: us-east-1
          BLINDBUCKET_ENDPOINT: http://127.0.0.1:9000
          BLINDBUCKET_BUCKET: blindbucket-dev
        run: |
          pip install --quiet boto3
          python3 test/integration/clients/boto3/scenarios.py

      # The AWS CLI is preinstalled on GitHub runners. `aws s3 cp` exercises the
      # aws-chunked path with a trailer checksum, which boto3's put_object does
      # not.
      - name: AWS CLI scenarios
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
        run: |
          set -euo pipefail
          head -c 200000 /dev/urandom > payload.bin
          mkdir -p tree/sub && head -c 5000 /dev/urandom > tree/a.bin \
            && head -c 60000 /dev/urandom > tree/sub/b.bin

          aws s3 cp payload.bin s3://blindbucket-dev/ci/payload.bin
          aws s3 cp s3://blindbucket-dev/ci/payload.bin restored.bin
          cmp payload.bin restored.bin

          test "$(aws s3 ls s3://blindbucket-dev/ci/ | awk '{print $3}')" = "200000"

      # A presigned URL is the one credential the gateway serves that arrives
      # with no client behind it, so curl is the right tool: no SDK, no signing,
      # no AWS environment. `aws s3 presign` is a local computation, which is
      # exactly why the gateway only ever has to verify one (ADR-019).
      - name: Presigned URL scenarios
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
        run: |
          set -euo pipefail
          url=$(aws s3 presign s3://blindbucket-dev/ci/payload.bin --expires-in 3600)

          # Downloaded by something holding no credential at all.
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY \
            curl -sf -o presigned.bin "$url"
          cmp payload.bin presigned.bin

          # A window that has closed is refused.
          expired=$(aws s3 presign s3://blindbucket-dev/ci/payload.bin --expires-in 1)
          sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' "$expired")
          test "$code" = "403" || { echo "expired URL answered $code, want 403"; exit 1; }

          # Writes are not served this way: a URL is where a bearer credential
          # gets copied, so the operations that change data stay off that path.
          put=$(aws s3 presign s3://blindbucket-dev/ci/nope.bin --expires-in 300)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT --data-binary @payload.bin "$put")
          test "$code" = "403" || { echo "presigned PUT answered $code, want 403"; exit 1; }
          ! aws s3 ls s3://blindbucket-dev/ci/nope.bin

      # Multipart through the balancer: the AWS CLI switches to it above 8 MiB on
      # its own, so this is the client's code path and not a hand-built request.
      - name: Multipart across two instances
        env:
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9020
        run: |
          set -euo pipefail
          aws configure set default.s3.multipart_threshold 8MB
          aws configure set default.s3.multipart_chunksize 8MB
          aws configure set default.s3.max_concurrent_requests 8

          head -c 41943040 /dev/urandom > big.bin        # 40 MiB, five parts
          aws s3 cp big.bin s3://blindbucket-dev/ci/big.bin
          aws s3 cp s3://blindbucket-dev/ci/big.bin big-restored.bin
          cmp big.bin big-restored.bin

          # The listing must report the plaintext size, recovered from the
          # ciphertext size and the part count in the ETag alone.
          test "$(aws s3 ls s3://blindbucket-dev/ci/big.bin | awk '{print $3}')" = "41943040"

          # A range that straddles a part boundary exercises the prefix sums.
          aws s3api get-object --bucket blindbucket-dev --key ci/big.bin \
            --range bytes=8388598-8388618 slice.bin >/dev/null
          dd if=big.bin of=expected-slice.bin bs=1 skip=8388598 count=21 status=none
          cmp slice.bin expected-slice.bin

          # Both instances must have served parts; if one served all of them the
          # balancer, not the gateway, is what this proved.
          a=$(grep -c '"op":"UploadPart"' gateway.log || true)
          b=$(grep -c '"op":"UploadPart"' gateway-b.log || true)
          echo "parts served: instance a=$a, instance b=$b"
          test "$a" -gt 0 && test "$b" -gt 0

      # gc has to leave a live object alone. Running it with the age guard off is
      # the strict form: only the ordering rules of R4 stand between the pass and
      # the manifest it must not touch.
      - name: gc leaves a live multipart object readable
        env:
          BLINDBUCKET_PASSPHRASE: ci-passphrase-not-a-secret
          AWS_ACCESS_KEY_ID: CITESTKEY
          AWS_SECRET_ACCESS_KEY: ci-test-secret-key
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9020
        run: |
          set -euo pipefail
          ./bin/blindbucket gc --config blindbucket.yaml --dry-run s3://blindbucket-dev
          ./bin/blindbucket gc --config blindbucket.yaml --min-age 0 s3://blindbucket-dev
          aws s3 cp s3://blindbucket-dev/ci/big.bin after-gc.bin
          cmp big.bin after-gc.bin

      - name: Gateway logs on failure
        if: failure()
        run: |
          echo "=== instance a ==="; tail -50 gateway.log || true
          echo "=== instance b ==="; tail -50 gateway-b.log || true
          echo "=== balancer ==="; docker logs lb 2>&1 | tail -30 || true
          echo "=== minio ==="; docker logs minio 2>&1 | tail -30 || true

          aws s3 sync tree s3://blindbucket-dev/ci/sync/
          aws s3 sync s3://blindbucket-dev/ci/sync/ tree-back
          diff -r tree tree-back

          aws s3api get-object --bucket blindbucket-dev --key ci/payload.bin \
            --range bytes=1000-1099 range.bin >/dev/null
          test "$(stat -c%s range.bin)" = "100"

          aws s3 rm s3://blindbucket-dev/ci/sync/ --recursive
          aws s3 rm s3://blindbucket-dev/ci/payload.bin


  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # govulncheck itself requires a newer Go than this module's floor, so this
      # job builds the tool with current Go. It still analyses the module as
      # declared.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
