name: Formal model

# The models in spec/tla cover the manifest coordination (ADR-010, ADR-009) and
# the name migration (ADR-022), not the Go code, so they run when a model or
# the coordination logic changes rather than on every push. MCFixed and
# MCMigrate explore ~8.7 and ~8.1 million states and are the reason for the
# path filter; MCFixedFull, with a third upload, is run by hand (ADR-025). rotate and
# objcopy are in it because the model's Rot process is theirs, and migrate
# because Migrate.tla is.
on:
  push:
    branches: [main]
    # Duplicated below: GitHub Actions does not resolve YAML anchors.
    paths:
      - "spec/tla/**"
      - "internal/manifest/**"
      - "internal/proxy/**"
      - "internal/objcopy/**"
      - "internal/rotate/**"
      - "internal/migrate/**"
      - ".github/workflows/tla.yml"
  pull_request:
    paths:
      - "spec/tla/**"
      - "internal/manifest/**"
      - "internal/proxy/**"
      - "internal/objcopy/**"
      - "internal/rotate/**"
      - "internal/migrate/**"
      - ".github/workflows/tla.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: .tools/tla2tools.jar
          key: tla2tools-v1.7.4

      - run: make tla-tools

      # Each module holds its PlusCal algorithm and the TLA+ translation of
      # it. If they drift apart, TLC checks something other than the algorithm
      # that is in the file, and nobody would notice.
      - name: The PlusCal translations are up to date
        run: |
          make tla-translate
          git diff --exit-code -- spec/tla/

      # Eight of the ten configurations are expected to produce a
      # counterexample; check.sh fails if one of them does not.
      - name: Check every configuration
        run: make tla
