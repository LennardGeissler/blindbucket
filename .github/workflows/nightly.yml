name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # The reference decoder in ref/python was written from docs/FORMAT.md alone.
  # Its value is entirely in being compared: a disagreement means the
  # specification is ambiguous or one of the two is wrong, and either is worth
  # knowing. 100 000 inputs is the floor and takes a few
  # minutes; the nightly budget allows more.
  differential:
    name: Differential decoder (Go vs Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography

      # The vectors are normative, so the reference decoder has to pass them
      # before its verdicts are worth comparing against anything.
      - name: Known-answer vectors
        working-directory: ref/python
        run: python3 test_vectors.py

      - name: Known-answer vectors (object name mapping)
        working-directory: ref/python
        run: python3 test_names_vectors.py

      - name: Differential fuzzing
        working-directory: ref/python
        run: python3 difftest.py --count 250000 --seeds 400 --seed ${{ github.run_number }}

      # The name mapping is the one construction this project composes rather
      # than calls, so the second implementation matters more here than
      # anywhere else in the format (ADR-015).
      - name: Differential fuzzing (object name mapping)
        working-directory: ref/python
        run: python3 difftest_names.py --count 250000 --seeds 5000 --seed ${{ github.run_number }}

  fuzz:
    name: Long fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - ./internal/crypto/stream
          - ./internal/crypto/keys
          - ./internal/crypto/envelope
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Fuzz every target in ${{ matrix.package }}
        run: |
          for target in $(go test -list 'Fuzz.*' ${{ matrix.package }} | grep '^Fuzz'); do
            echo "==> $target"
            go test ${{ matrix.package }} -run '^$' -fuzz "^$target$" -fuzztime=15m
          done
      - name: Upload any failing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: testdata/fuzz/

  memory:
    name: 10 GiB memory proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The M1 definition of done: 10 GiB encrypted and decrypted with an
      # identical SHA-256, at a heap that does not grow with the object.
      - run: BLINDBUCKET_STREAM_SIZE=10GiB go test ./internal/crypto/stream -run TestLargeStreamRoundTrip -v -timeout 40m

  rss:
    name: CLI resident memory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make build
      # RSS is only meaningful on Linux: see bench/README.md for why the macOS
      # figure is not.
      - name: Measure RSS over a 2 GiB stream
        env:
          BLINDBUCKET_PASSPHRASE: nightly-ci-passphrase-not-a-secret
        run: |
          ./bin/blindbucket keygen --out keyring.json
          head -c 2147483648 /dev/urandom > big.bin
          bench/rss-sample.sh rss.csv ./bin/blindbucket encrypt --keyring keyring.json -i big.bin -o big.bb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rss-samples
          path: rss.csv
