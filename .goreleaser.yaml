# Release build: binaries, checksums, an SBOM and a distroless image.
version: 2

project_name: blindbucket

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: blindbucket
    main: ./cmd/blindbucket
    binary: blindbucket
    # No cgo: the crypto is Go's own, so the binary is static and the image can
    # be distroless/static. ADR-011 records why that matters.
    env:
      - CGO_ENABLED=0
    flags:
      # -trimpath keeps absolute build paths out of the binary, which is both a
      # small information leak and the main obstacle to a reproducible build.
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: blindbucket
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/FORMAT.md
      - docs/THREAT_MODEL.md
      - blindbucket.example.yaml
      # Shell completions for bash, zsh and fish; each script's header says
      # where it goes.
      - contrib/completions/*

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The vectors below are checksummed with the binaries, so a second
  # implementation can verify what it tests against the same way.
  extra_files:
    - glob: ./testdata/vectors/*_v*.json

sboms:
  - artifacts: archive

# One entry builds both architectures and the manifest that ties them together.
# The image is distroless/static:nonroot with the binary goreleaser already
# produced copied in, so the released binary and the one in the image are the
# same bytes.
dockers_v2:
  - images:
      - "ghcr.io/lennardgeissler/blindbucket"
    tags:
      - "{{ .Version }}"
      # Only a real release moves `latest`; a prerelease must not.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: deploy/Dockerfile.release
    sbom: true
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Transparent S3 encryption gateway"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/LennardGeissler/blindbucket"
      org.opencontainers.image.licenses: "Apache-2.0"

# The Homebrew cask: brew install --cask lennardgeissler/tap/blindbucket, on
# macOS and Linux. It installs the released archive's binary -- the archive
# the provenance attestation is for -- and the shell completions beside it.
#
# Two things follow from the release being a draft until it is published. The
# archives of a draft are not public, so a cask pointing at them would fail
# every `brew upgrade` until then: it is pushed to a branch of its own, and
# .github/workflows/tap.yml moves it onto the tap's main branch when the
# release is published. And a prerelease never reaches it (skip_upload: auto).
#
# The binary is not signed or notarised by Apple. Homebrew quarantines a
# cask's download, and Gatekeeper then refuses to run it: measured with 1.4.0,
# `blindbucket version` printed nothing until the quarantine was gone. The
# post-install step removes it from that one file, and the caveat says so and
# how to check the archive instead. What protects the download is the cask's
# SHA-256 and the release's attestation, not Apple.
#
# The step is Homebrew's declarative postflight_steps, which runs in the
# staged directory; its legacy `postflight do` makes Homebrew 7 warn on every
# command that loads the cask. goreleaser 2.18, which the release workflow
# runs, can only write the legacy form from `hooks`, so the block goes in as
# custom_block. Installed from a tap and audited with `brew audit --strict`:
# no warning, no finding.
homebrew_casks:
  - name: blindbucket
    homepage: https://github.com/LennardGeissler/blindbucket
    description: "Transparent S3 encryption gateway: clients speak S3, the provider holds ciphertext"
    binaries: [blindbucket]
    completions:
      bash: contrib/completions/blindbucket.bash
      zsh: contrib/completions/_blindbucket
      fish: contrib/completions/blindbucket.fish
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "blindbucket"], chdir: "."
        end
      end
    # The attestation covers the archives in checksums.txt, not the binary
    # inside one, so the caveat checks the archive Homebrew keeps in its cache.
    caveats: |
      blindbucket is not notarised by Apple; this cask removes macOS's quarantine
      from its binary. To check that the archive it came from is the one the
      release built:
        gh attestation verify "$(brew --cache --cask lennardgeissler/tap/blindbucket)" --repo LennardGeissler/blindbucket
    repository:
      owner: LennardGeissler
      name: homebrew-tap
      branch: "blindbucket-{{ .Version }}"
      git:
        url: git@github.com:LennardGeissler/homebrew-tap.git
        # The deploy key of the tap, which can write to it and to nothing
        # else. Empty -- a snapshot, a fork -- skips the cask.
        private_key: '{{ envOrDefault "HOMEBREW_TAP_KEY" "" }}'
        # GitHub's host keys, which the release workflow fetches from its API,
        # instead of the default of trusting the first key offered.
        ssh_command: 'ssh -i {{ .KeyPath }} -o UserKnownHostsFile={{ envOrDefault "TAP_KNOWN_HOSTS" "/dev/null" }} -o StrictHostKeyChecking=yes -F /dev/null'
    commit_msg_template: "blindbucket {{ .Tag }}"
    skip_upload: auto

release:
  draft: true
  prerelease: auto
  # The known-answer vectors of FORMAT.md §13, §15.6, §17.5 and §18.8, for anyone writing a
  # second implementation to test against. Named by the format version they
  # pin rather than the release: segment_v1.json is the same file in every
  # release that writes format 1, which is the point.
  extra_files:
    - glob: ./testdata/vectors/*_v*.json
  # One line per paragraph: a release page breaks a line wherever its text
  # does, as build/releasenotes explains for the notes above this footer.
  footer: |
    ## Verifying a download

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    ```

    That shows a download is intact, not where it came from: `checksums.txt` travels with the files it describes. Every archive, the vectors and the image also carry a provenance attestation, signed for the release workflow and logged publicly, which says which commit and which workflow run built them:

    ```sh
    gh attestation verify blindbucket_{{ .Version }}_linux_amd64.tar.gz --repo LennardGeissler/blindbucket
    gh attestation verify oci://ghcr.io/lennardgeissler/blindbucket:{{ .Version }} --repo LennardGeissler/blindbucket
    ```

    The attestation of the archives and the vectors is also attached here, as `blindbucket_{{ .Version }}_provenance.intoto.jsonl`. With it, a download verifies without fetching the attestation from GitHub:

    ```sh
    gh attestation verify blindbucket_{{ .Version }}_linux_amd64.tar.gz --repo LennardGeissler/blindbucket --bundle blindbucket_{{ .Version }}_provenance.intoto.jsonl
    ```

    `segment_v1.json`, `names_v1.json` and `tags_v1.json` are the known-answer vectors of `docs/FORMAT.md`, for testing another implementation against format 1, and `keyring_v2.json` those of the keyring file's version 2.

    The container image is `distroless/static:nonroot`: no shell, no package manager, and it runs as uid 65532. Mount the keyring read-only and give the container a read-only root filesystem.

# The release notes are the release's section of CHANGELOG.md, which the
# release workflow renders with build/releasenotes and passes as
# --release-notes; goreleaser then writes no changelog of its own. Not
# `disable: true`: that skips the step which loads the file, and the release
# goes out with nothing but the footer above, as every one up to 1.1.0 did.
