\* Negative test: a bucket allowed to leave the tenant.  Its objects stay on
\* the tenant's key, and destroying the tenant destroys them, though they are
\* no longer its.  TLC must report a violation of NoCollateral.
\*
\* ReadableEverywhere is left out: an instance that restarts onto the
\* tombstone no longer opens the tenant's key and cannot read that object
\* either.  It is the same harm seen from the instance, and would only race
\* the counterexample this configuration is for.
SPECIFICATION Spec

CONSTANTS
    i1 = i1
    i2 = i2
    Instances          = {i1, i2}
    TwoPhase           = TRUE
    CensusRequired     = TRUE
    CensusGated        = TRUE
    LockLast           = TRUE
    BucketsLeave       = TRUE
    RotateChecksTenant = TRUE
    Reseal             = TRUE
    DestroyAllLocks    = TRUE
    MaxRotations       = 2

SYMMETRY Perms

INVARIANTS
    TypeOK
    Shredded
    NoCollateral
    Abortable

CHECK_DEADLOCK FALSE
