\* Negative test for I2: rotation with If-Match alone, as ADR-009 wrote it, on
\* a provider that ranks an upload by when it was created (ADR-025).  A client
\* upload created before the rotation's copy and completed after it is
\* discarded in the copy's favour: the client was told its write succeeded, and
\* the object holds the rotated old version.  If-Match cannot see the upload,
\* because it is not visible yet.  TLC must report a violation of I2.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    Uploads     = {u1}
    CleanupMode = "verify"
    GcMode      = "r4"
    RotateMode  = "ifmatch"
    Ordering    = "initiation"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
