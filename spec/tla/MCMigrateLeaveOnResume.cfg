\* Negative test: the abort the model was written for.  A run publishes the
\* copy and dies before deleting P; the next run finds an object at E(P) and,
\* deleting only what it copied itself, leaves P where it is.  No client
\* writes, so the object at E(P) can only be that copy.
\* TLC must report a violation of Converged.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    Runs          = {r1, r2}
    CreateGuard   = "ifnonematch"
    ExistingEnc   = "conflict"
    DeleteGuard   = "none"
    ClientWrites  = FALSE
    ClientDeletes = FALSE
    StaleWriter   = FALSE
    Ordering      = "completion"
    YieldToUploads = TRUE

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    NoLostWrite
    NoLostDelete
    Converged

CHECK_DEADLOCK FALSE
