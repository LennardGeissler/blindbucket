\* The design under test (ADR-038): a tenant added inactive and activated once
\* every instance serves it, a census once nothing can still write its buckets
\* under another key, the tombstone, and every lock it ever had destroyed once
\* the tombstone has reached every process.  Two instances, two rotate runs
\* that may die at any point, a reseal.  TLC must find no violation.
SPECIFICATION Spec

CONSTANTS
    i1 = i1
    i2 = i2
    Instances          = {i1, i2}
    TwoPhase           = TRUE
    CensusRequired     = TRUE
    CensusGated        = TRUE
    LockLast           = TRUE
    BucketsLeave       = FALSE
    RotateChecksTenant = TRUE
    Reseal             = TRUE
    DestroyAllLocks    = TRUE
    MaxRotations       = 2

SYMMETRY Perms

INVARIANTS
    TypeOK
    Shredded
    NoCollateral
    Abortable
    ReadableEverywhere

CHECK_DEADLOCK FALSE
