\* The design under test (ADR-022): the copy is published with If-None-Match,
\* an object found at E(P) makes P obsolete, and P is deleted without a
\* condition.  Two runs that may each die after any step, a client PUT, a
\* client multipart upload, one gc pass per key and the lifecycle rule.
\* TLC must find no violation.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    Runs          = {r1, r2}
    CreateGuard   = "ifnonematch"
    ExistingEnc   = "obsolete"
    DeleteGuard   = "none"
    ClientWrites  = TRUE
    ClientDeletes = FALSE
    StaleWriter   = FALSE

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    NoLostWrite
    NoLostDelete
    Converged

CHECK_DEADLOCK FALSE
