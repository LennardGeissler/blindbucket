\* The design under test (ADR-022, ADR-025): the copy gives way to an open
\* upload of E(P) and is published with If-None-Match, an object found at E(P)
\* makes P obsolete, and P is deleted without a condition, on a provider that
\* may keep or discard an upload completing after a newer write.  Two runs
\* that may each die after any step, a client PUT, a client multipart upload,
\* one gc pass per key and the lifecycle rule.  TLC must find no violation.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    Runs          = {r1, r2}
    CreateGuard   = "ifnonematch"
    ExistingEnc   = "obsolete"
    DeleteGuard   = "none"
    ClientWrites  = TRUE
    ClientDeletes = FALSE
    StaleWriter   = FALSE
    Ordering      = "either"
    YieldToUploads = TRUE

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    NoLostWrite
    NoLostDelete
    Converged

CHECK_DEADLOCK FALSE
