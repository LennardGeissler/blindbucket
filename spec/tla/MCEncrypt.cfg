\* The design under test for `blindbucket encrypt-existing` with names in
\* clear (ADR-034): the key starts with a plaintext object and no manifest, and
\* the command overwrites it with rotation's final write -- If-Match on the
\* etag it read, after giving way to any open upload of the key.  Two
\* concurrent client uploads, a single-part PUT, a delete and one gc pass on
\* the same key, a crash possible after every step, on a provider that may keep
\* or discard any write landing after a newer one.  TLC must find no violation.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    u2 = u2
    Uploads     = {u1, u2}
    CleanupMode = "verify"
    GcMode      = "r4"
    RotateMode  = "conditional"
    Ordering    = "either"
    Initial     = "plaintext"

    Tags        = FALSE
    TagAge      = "kept"
SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
