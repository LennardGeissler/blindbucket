\* Negative test: the documented price of migrating without a transitional
\* gateway mode (ADR-022).  A client deletes the object while it is still
\* at P, where the delete does not reach; the migration then copies it to
\* E(P) and it is back.
\* TLC must report a violation of NoLostDelete.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    Runs          = {r1, r2}
    CreateGuard   = "ifnonematch"
    ExistingEnc   = "obsolete"
    DeleteGuard   = "none"
    ClientWrites  = FALSE
    ClientDeletes = TRUE
    StaleWriter   = FALSE
    Ordering      = "completion"
    YieldToUploads = TRUE

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    NoLostWrite
    NoLostDelete
    Converged

CHECK_DEADLOCK FALSE
