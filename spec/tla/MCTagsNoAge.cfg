\* MCTags with gc ignoring its minimum age for sidecars.  A PUT writes its
\* sidecar before the object and opens no upload, so a gc pass in between
\* finds a sidecar that belongs to no visible version and deletes it; the
\* object then lands without its tags.  TLC must find a violation of I3.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    u2 = u2
    Uploads     = {u1, u2}
    CleanupMode = "verify"
    GcMode      = "r4"
    RotateMode  = "conditional"
    Ordering    = "either"
    Initial     = "gateway"
    Tags        = TRUE
    TagAge      = "ignored"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2
    I3

CHECK_DEADLOCK FALSE
