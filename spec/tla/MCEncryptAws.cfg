\* Negative test for I2: encrypt-existing with If-Match alone, without giving
\* way to open uploads, on a provider that ranks an upload by when it was
\* created (ADR-025, ADR-034).  A client upload created before the command's
\* and completed after it is discarded in the command's favour, though the
\* client was told it succeeded.  TLC must report a violation of I2.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    Uploads     = {u1}
    CleanupMode = "verify"
    GcMode      = "r4"
    RotateMode  = "ifmatch"
    Ordering    = "initiation"
    Initial     = "plaintext"

    Tags        = FALSE
    TagAge      = "kept"
SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
