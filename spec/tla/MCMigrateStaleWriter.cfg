\* Negative test for ADR-022's precondition: a gateway instance still serving
\* names in clear writes P during the migration.  The delete of P carries
\* If-Match, the strongest guard there is, and the write is lost anyway.
\* TLC must report a violation of NoLostWrite.
\*
\* Converged is left out: a stale write after the last run has finished puts
\* an object back at P, which is the same precondition broken a second way
\* and would only race the counterexample this configuration is for.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    Runs          = {r1, r2}
    CreateGuard   = "ifnonematch"
    ExistingEnc   = "obsolete"
    DeleteGuard   = "ifmatch"
    ClientWrites  = FALSE
    ClientDeletes = FALSE
    StaleWriter   = TRUE

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    NoLostWrite
    NoLostDelete

CHECK_DEADLOCK FALSE
