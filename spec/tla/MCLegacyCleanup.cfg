\* Negative test: the second race ADR-010 records.  Completion deletes
\* "all other manifests of this key" instead of only the one it observed,
\* so it reaches into the manifest of an upload that has not completed yet.
\* TLC must report a violation of I1.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    u2 = u2
    Uploads     = {u1, u2}
    CleanupMode = "v01"
    GcMode      = "r4"
    RotateMode  = "off"
    Ordering    = "completion"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
