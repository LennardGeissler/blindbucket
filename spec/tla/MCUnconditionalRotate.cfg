\* Negative test for I2: `blindbucket rotate --allow-unconditional`, the mode
\* the documentation requires for upstreams without conditional writes.
\* TLC must report a violation of I2 -- which is what the flag's warning and
\* the "no writes to the prefix meanwhile" requirement in 11.2 are about.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    Uploads     = {u1}
    CleanupMode = "r3"
    GcMode      = "r4"
    RotateMode  = "unconditional"
    Ordering    = "completion"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
