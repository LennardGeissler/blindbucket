\* The design under test: R1-R4 from ADR-010, with R3 verifying the
\* replacement (ADR-025), and the conditional write from ADR-009, on a provider
\* that may keep or discard any write landing after a newer one.  Three
\* concurrent uploads, a single-part PUT, a delete, one rotation and one gc
\* pass, all on the same key, with a crash possible after every step.  TLC
\* must find no violation.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    u2 = u2
    u3 = u3
    Uploads     = {u1, u2, u3}
    CleanupMode = "verify"
    GcMode      = "r4"
    RotateMode  = "conditional"
    Ordering    = "either"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
