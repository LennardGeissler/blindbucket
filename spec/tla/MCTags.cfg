\* The tag sidecars of ADR-037 on the design under test: every client write
\* carries tags, written to a sidecar before the version becomes visible, the
\* rotation carries the tags of the version it read, and gc deletes only the
\* sidecars past its minimum age that are not the current version's.  One
\* upload, a PUT, a delete, a rotation and a gc pass, on a provider that may
\* keep or discard any write landing after a newer one.  TLC must find no
\* violation of I1, I2 or I3.  MCTagsFull is the same with two uploads.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    Uploads     = {u1}
    CleanupMode = "verify"
    GcMode      = "r4"
    RotateMode  = "conditional"
    Ordering    = "either"
    Initial     = "gateway"
    Tags        = TRUE
    TagAge      = "kept"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2
    I3

CHECK_DEADLOCK FALSE
