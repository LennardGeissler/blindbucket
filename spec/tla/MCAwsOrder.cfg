\* Negative test: R3 as ADR-010 wrote it, on a provider that orders writes the
\* way AWS S3 does (ADR-025).  A completion deletes the manifest it observed
\* on the strength of Complete succeeding -- but AWS keeps the write that was
\* initiated last, so an upload created before the visible version's write is
\* acknowledged and discarded, and the version it "replaced" is still the one
\* every reader gets.  TLC must report a violation of I1.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    u2 = u2
    Uploads     = {u1, u2}
    CleanupMode = "r3"
    GcMode      = "r4"
    RotateMode  = "off"
    Ordering    = "initiation"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
