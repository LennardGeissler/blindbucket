\* Negative test: the copy is published without If-None-Match.  A client
\* write that lands at E(P) between the run's HEAD of E(P) and its
\* completion is replaced by the older version from P.
\* TLC must report a violation of NoLostWrite.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    Runs          = {r1, r2}
    CreateGuard   = "none"
    ExistingEnc   = "obsolete"
    DeleteGuard   = "none"
    ClientWrites  = TRUE
    ClientDeletes = FALSE
    StaleWriter   = FALSE
    Ordering      = "completion"
    YieldToUploads = TRUE

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    NoLostWrite
    NoLostDelete
    Converged

CHECK_DEADLOCK FALSE
