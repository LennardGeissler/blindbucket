\* Negative test for rule 2: the census taken while an instance still serves
\* the generation in which the tenant was added but not active.  It writes x
\* under the default key after the count.  TLC must report a violation of
\* Shredded.
SPECIFICATION Spec

CONSTANTS
    i1 = i1
    i2 = i2
    Instances          = {i1, i2}
    TwoPhase           = TRUE
    CensusRequired     = TRUE
    CensusGated        = FALSE
    LockLast           = TRUE
    BucketsLeave       = FALSE
    RotateChecksTenant = TRUE
    Reseal             = TRUE
    DestroyAllLocks    = TRUE
    MaxRotations       = 2

SYMMETRY Perms

INVARIANTS
    TypeOK
    Shredded
    NoCollateral
    Abortable
    ReadableEverywhere

CHECK_DEADLOCK FALSE
