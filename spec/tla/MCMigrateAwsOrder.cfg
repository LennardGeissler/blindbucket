\* Negative test (ADR-025): the copy published with If-None-Match alone, on a
\* provider that ranks an upload by when it was created, as AWS S3 does.  A
\* client upload to E(P) created before the migration's copy and completed
\* after it is discarded in the copy's favour: the client was told its write
\* succeeded, and E(P) holds the older version from P.  If-None-Match cannot
\* see the upload, because nothing is at E(P) yet.  TLC must report a
\* violation of NoLostWrite.
SPECIFICATION Spec

CONSTANTS
    r1 = r1
    Runs          = {r1}
    CreateGuard   = "ifnonematch"
    ExistingEnc   = "obsolete"
    DeleteGuard   = "none"
    ClientWrites  = TRUE
    ClientDeletes = FALSE
    StaleWriter   = FALSE
    Ordering      = "initiation"
    YieldToUploads = FALSE

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    NoLostWrite
    NoLostDelete
    Converged

CHECK_DEADLOCK FALSE
