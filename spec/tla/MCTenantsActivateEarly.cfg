\* Negative test for rule 1: a tenant added active.  An instance that has
\* restarted writes z under the tenant's key, and one that has not cannot read
\* it.  TLC must report a violation of ReadableEverywhere.
SPECIFICATION Spec

CONSTANTS
    i1 = i1
    i2 = i2
    Instances          = {i1, i2}
    TwoPhase           = FALSE
    CensusRequired     = TRUE
    CensusGated        = TRUE
    LockLast           = TRUE
    BucketsLeave       = FALSE
    RotateChecksTenant = TRUE
    Reseal             = TRUE
    DestroyAllLocks    = TRUE
    MaxRotations       = 2

SYMMETRY Perms

INVARIANTS
    TypeOK
    Shredded
    NoCollateral
    Abortable
    ReadableEverywhere

CHECK_DEADLOCK FALSE
