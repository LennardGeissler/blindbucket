\* Negative test for I2: `blindbucket encrypt-existing --allow-unconditional`
\* on a key that starts with a plaintext object (ADR-034).  A client write
\* landing between the command's read and its completion is overwritten with
\* the encrypted old plaintext.  TLC must report a violation of I2 -- which is
\* why the flag requires that nothing writes to the prefix meanwhile.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    Uploads     = {u1}
    CleanupMode = "verify"
    GcMode      = "r4"
    RotateMode  = "unconditional"
    Ordering    = "completion"
    Initial     = "plaintext"

    Tags        = FALSE
    TagAge      = "kept"
SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
