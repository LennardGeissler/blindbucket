\* Negative test: the lock destroyed before the tombstone has reached every
\* process.  Once the instances restart, the tenant's objects are unreadable
\* while the destruction could still be called off.  TLC must report a
\* violation of Abortable.
SPECIFICATION Spec

CONSTANTS
    i1 = i1
    i2 = i2
    Instances          = {i1, i2}
    TwoPhase           = TRUE
    CensusRequired     = TRUE
    CensusGated        = TRUE
    LockLast           = FALSE
    BucketsLeave       = FALSE
    RotateChecksTenant = TRUE
    Reseal             = TRUE
    DestroyAllLocks    = TRUE
    MaxRotations       = 2

SYMMETRY Perms

INVARIANTS
    TypeOK
    Shredded
    NoCollateral
    Abortable
    ReadableEverywhere

CHECK_DEADLOCK FALSE
