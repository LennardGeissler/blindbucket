\* Negative test on R4 itself: gc does check for open uploads, but asks
\* before listing the manifests instead of after.  Both steps are read-only,
\* which is exactly why the order looks arbitrary and is not.
\* TLC must report a violation of I1.
SPECIFICATION Spec

CONSTANTS
    u1 = u1
    u2 = u2
    Uploads     = {u1, u2}
    CleanupMode = "r3"
    GcMode      = "swapped"
    RotateMode  = "off"
    Ordering    = "completion"

SYMMETRY Perms

INVARIANTS
    TypeOK
    I1
    I2

CHECK_DEADLOCK FALSE
