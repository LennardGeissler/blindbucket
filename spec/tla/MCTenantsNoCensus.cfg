\* Negative test: the tombstone written without a census.  The object x held
\* before it joined the tenant is still on the default key, which no
\* destruction touches.  TLC must report a violation of Shredded.
SPECIFICATION Spec

CONSTANTS
    i1 = i1
    i2 = i2
    Instances          = {i1, i2}
    TwoPhase           = TRUE
    CensusRequired     = FALSE
    CensusGated        = TRUE
    LockLast           = TRUE
    BucketsLeave       = FALSE
    RotateChecksTenant = TRUE
    Reseal             = TRUE
    DestroyAllLocks    = TRUE
    MaxRotations       = 2

SYMMETRY Perms

INVARIANTS
    TypeOK
    Shredded
    NoCollateral
    Abortable
    ReadableEverywhere

CHECK_DEADLOCK FALSE
